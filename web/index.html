<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f2ee" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="PLAYBILL" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/styles.css" />
<title>PLAYBILL</title>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <g transform="rotate(-6 32 32)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="14" y="9" width="36" height="46" rx="2.5" stroke-width="4.2"/>
          <path d="M29.8 26.6 35 32.7 40.2 26.6" stroke-width="4"/>
          <path d="M35 32.7v12" stroke-width="4"/>
          <path d="M29.4 36.4h11.2M29.4 40.6h11.2" stroke-width="4"/>
        </g>
      </svg>
    </span>
    <div class="brand-text">
      <h1>PLAYBILL</h1>
      <span class="sub" id="sub">正在载入…</span>
    </div>
  </div>
  <div class="top-actions">
    <button id="btnSyncTx" class="primary small" title="从交易记录同步购入价">
      <svg viewBox="0 0 16 16" fill="none"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 3v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      同步交易
    </button>
    <button id="btnSync" class="small" title="同步游戏库与封面">
      <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0 3-3m-3 3L5 7M3 13h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      同步游戏
    </button>
    <button id="btnSettings" class="icon-btn" title="设置">
      <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </button>
    <button id="btnLogin" class="icon-btn" title="账号">
      <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="rail">
    <div class="rail-total">
      <div class="lbl">累计消费</div>
      <div class="val" id="total">—</div>
      <div class="lbl-2" id="railSub">—</div>
    </div>
    <div class="rail-title">导航</div>
    <nav id="seriesList"></nav>
  </aside>

  <main class="main">
    <div id="detail"></div>
  </main>
</div>

<!-- 登录 -->
<div class="modal" id="loginModal" hidden>
  <div class="sheet">
    <div class="sheet-head"><h3>连接 PSN 账号</h3><button class="close" data-close="loginModal">×</button></div>
    <div class="sheet-body">
      <p class="hint">令牌只保存在本机，不会上传。用于拉取你拥有的游戏与封面。</p>
      <ol class="hint" style="padding-left:18px">
        <li>浏览器登录 playstation.com</li>
        <li>同一浏览器打开 ca.account.sony.com/api/v1/ssocookie</li>
        <li>复制 64 位 npsso 粘贴到下面</li>
      </ol>
      <textarea id="npssoInput" rows="3" placeholder="粘贴 npsso"></textarea>
      <div class="row"><button id="btnDoLogin" class="primary wide">登录并保存</button></div>
      <div class="row"><button id="btnLogout" class="wide">退出 / 清除令牌</button></div>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settingsModal" hidden>
  <div class="sheet">
    <div class="sheet-head"><h3>设置</h3><button class="close" data-close="settingsModal">×</button></div>
    <div class="sheet-body">
      <label class="field"><span>商店地区</span>
        <select id="setCountry">
          <option value="HK">香港 HK</option>
          <option value="TW">台湾 TW</option>
          <option value="US">美国 US</option>
          <option value="JP">日本 JP</option>
          <option value="GB">英国 GB</option>
        </select>
      </label>
      <label class="field"><span>币种</span><input id="setCurrency" type="text" placeholder="HKD" /></label>
      <label class="field"><span>语言码</span><input id="setLang" type="text" placeholder="zh" /></label>
      <div class="row"><button id="btnSaveSettings" class="primary wide">保存</button></div>
      <div class="row"><button id="btnRefreshPrices" class="wide">更新商店现价与封面（首次 1-2 分钟）</button></div>
      <div id="diagBox"></div>
    </div>
  </div>
</div>

<!-- 网络自检 -->
<div class="modal" id="netModal" hidden>
  <div class="sheet">
    <div class="sheet-head"><h3>网络自检</h3><button class="close" data-close="netModal">×</button></div>
    <div class="sheet-body" id="netBody"><p class="hint">正在检测…</p></div>
  </div>
</div>

<!-- 价格历史 -->
<div class="modal" id="historyModal" hidden>
  <div class="sheet wide">
    <div class="sheet-head"><h3 id="histTitle">价格历史</h3><button class="close" data-close="historyModal">×</button></div>
    <div class="sheet-body">
      <div class="hist-stats" id="histStats"></div>
      <div id="histChart"></div>
      <p class="hint" id="histNote"></p>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
